name: solar_insight
description: "Gestao inteligente de usinas solares e auditoria de creditos."
publish_to: 'none'

version: 1.0.0+12

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistencia Local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Backend e Nuvem
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.3
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.1

  # Utilitarios
  intl: ^0.20.2
  provider: ^6.1.2
  brasil_fields: ^1.15.1
  fl_chart: ^0.66.0
  file_saver: ^0.2.0
  csv: ^6.0.0
  file_picker: ^10.3.10
  share_plus: ^12.0.1
  connectivity_plus: ^7.0.0
  firebase_app_check: ^0.3.2+10
  http: ^1.6.0
  path_provider: ^2.1.5
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Geradores de Codigo
  build_runner: 2.4.13 
  hive_generator: ^2.0.1
  
  # Pacotes para Icone e Tela de Abertura
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  
  # Declarar a pasta de assets para o Flutter encontrar o logo
  assets:
    - assets/logo.png
    - assets/logoweb.png
    - assets/geminiapp/gemini.txt

# ==========================================
# CONFIGURAÇÃO DO ÍCONE DO APP E WEB
# ==========================================
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff" # Cor do fundo na Web
    theme_color: "#E64A19"      # Cor do tema (DeepOrange)

# ==========================================
# CONFIGURAÇÃO DA TELA DE ABERTURA (SPLASH)
# ==========================================
flutter_native_splash:
  color: "#ffffff"              # Fundo branco na tela de carregamento
  image: "assets/logo.png"      # Seu logotipo no centro
  android_12:
    image: "assets/logo.png"
    color: "#ffffff"
  android: true
  ios: true
  web: false # A web já tem um loader nativo melhor