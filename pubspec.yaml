name: solar_insight
description: "Gestao inteligente de usinas solares e auditoria de creditos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # <--- Adicione esta linha
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistencia Local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Backend e Nuvem
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.3
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.1

  # Utilitarios
  intl: ^0.20.2
  provider: ^6.1.2
  brasil_fields: ^1.15.1
  fl_chart: ^0.66.0
  file_saver: ^0.2.0
  csv: ^6.0.0
  file_picker: ^8.0.0
  share_plus: ^12.0.1
  connectivity_plus: ^7.0.0
  firebase_app_check: ^0.3.2+10
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Geradores de Codigo
  build_runner: 2.4.13 
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true