# This file was auto-generated by the Firebase CLI and fixed for Flutter
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o código do seu repositório
      - uses: actions/checkout@v4

      # 2. INSTALA O SDK DO FLUTTER (O passo que faltava)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Ele vai pegar a versão estável mais recente automaticamente

      # 3. Baixa as bibliotecas (packages) do seu projeto
      - name: Install dependencies
        run: flutter pub get

      # 4. Compila a versão Web para produção
      - name: Build Web
        run: flutter build web --release

      # 5. Faz o upload para o Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLAR_INSIGHT_PRO }}
          channelId: live
          projectId: solar-insight-pro